name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (installed)
        - Windows (portable)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 15.3, Windows 11 24H2
  - type: input
    id: app-version
    attributes:
      label: Wharf Archive version
      placeholder: e.g. 1.6.1
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages or screenshots
      description: Please don't paste credentials, tokens or Access Packs.
